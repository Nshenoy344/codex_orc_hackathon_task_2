[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "franka-lego-sorter"
version = "0.1.0"
description = "Camera-guided Franka FR3 LEGO shade sorting demo"
requires-python = ">=3.10"
dependencies = ["numpy<2", "PyYAML", "pyrealsense2"]

[tool.setuptools.packages.find]
include = ["lego_sorter*"]
